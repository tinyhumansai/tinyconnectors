[package]
name = "tinyconnectors-bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The TinyBus wire contract for TinyConnectors: OAuth connector member names, payload types, and the contract version."
documentation = "https://docs.rs/tinyconnectors-bus"
readme = "README.md"
keywords = ["tinybus", "oauth", "connectors", "contract"]
categories = ["api-bindings"]
publish = false

# Deliberately dependency-light: this is the crate a host links to talk to the
# loadable module, so it must cost that host almost nothing. Nothing here may
# pull in `tinybus`, an async runtime, an HTTP client, or a native library —
# see `src/lib.rs` for why the transport in particular is absent. CI asserts it.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Verifying and decoding Composio's webhook deliveries, for a host that
# receives them at its own endpoint. Optional: only the `webhook` feature
# pulls these in, so a host that never sees a delivery pays nothing.
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
# The webhook module's error type, the same derive the module crate uses.
thiserror = { workspace = true, optional = true }
# Only the `storage` feature: `storage::storage_schema` is built from the
# storage ports' declaration types. Ports only, no driver; the ports crate's
# tokio use is limited to io-util and time. Off by default, so the default
# dependency closure of this contract is unchanged.
tinystoragedrivers-core = { workspace = true, optional = true }

[dev-dependencies]
# `MemoryStorage` runs the v1 to v2 steps over real documents and streams.
tokio = { workspace = true }

[features]
# `storage::{storage_schema, storage_needs}`: the module's storage schema and the
# grant generated from it, as pure data over the storage ports. A host that
# composes schemas enables this; a host that only makes calls does not.
storage = ["dep:tinystoragedrivers-core"]
# `composio::triggers::webhook`: verify a delivery's signature and decode its
# body into a `ComposioTriggerEvent`. Pure functions over bytes — no transport,
# no runtime — for a host that owns a public webhook endpoint.
webhook = ["dep:hmac", "dep:sha2", "dep:base64", "dep:thiserror"]

[lints]
workspace = true
