[package]
name = "tinyconnectors-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Connector provider registry, scope catalogs and scope preferences."
documentation = "https://docs.rs/tinyconnectors-sync"
readme = "README.md"
keywords = ["tinybus", "oauth", "composio", "connectors"]
categories = ["api-bindings"]
publish = false

# Deliberately free of any memory or storage dependency. Preferences go through
# a host-implemented seam (`PrefsStore`); see `src/lib.rs`.
[dependencies]
# The capability-matrix payloads the registry builds.
tinyconnectors-bus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Provider traits and the preference store seam are object-safe and async.
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
